[package]
name = "web-source-scanner"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Local Windows website source scanner with Chinese categorized reports"

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:rfd"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
walkdir = "2"
encoding_rs = "0.8"
quick-xml = "0.41"
tempfile = "3"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
tree-sitter = "0.25"
tree-sitter-c-sharp = "0.23"
sha2 = "0.10"
eframe = { version = "0.32.3", default-features = false, features = ["glow", "default_fonts"], optional = true }
rfd = { version = "0.15.4", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_Security"] }

[profile.release]
opt-level = 2
strip = "debuginfo"

[[bin]]
name = "web-source-scanner"
path = "src/main.rs"

[[bin]]
name = "web-source-scanner-cli"
path = "src/cli.rs"
